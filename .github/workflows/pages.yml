name: Deploy auto-blog to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build static Pages site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Create static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site

          if [ -f "docs/index.html" ]; then
            cp -R docs/* site/
          elif [ -f "index.html" ]; then
            cp -R . site/
            rm -rf site/.git site/.github site/.venv site/__pycache__ site/.env site/token.json site/credentials.json
          else
            cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Arabic Herbal Health Blog System</title>
            <meta name="description" content="مشروع Python لأتمتة إنشاء ونشر مقالات صحية عربية على Blogger.">
          </head>
          <body>
            <main style="max-width:900px;margin:60px auto;font-family:system-ui;padding:24px;line-height:1.8">
              <h1>Arabic Herbal Health Blog System</h1>
              <p>نظام آلي مبني بلغة Python لجلب المقالات الصحية العربية، إعادة صياغتها، تحسينها لمحركات البحث، ثم نشرها على Blogger.</p>
              <p>This GitHub Pages site is the public landing page for the auto-blog repository.</p>
              <p><a href="https://github.com/kosama685/auto-blog">View source on GitHub</a></p>
            </main>
          </body>
          </html>
          HTML
          fi

          touch site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
